[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-runtime-sdk"
version = "0.1.0"
description = "Provider-neutral model runtime and MCP client for da-platform services"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "mcp>=1.27,<2",
    "pydantic>=2.10",
]

[project.optional-dependencies]
gemini = ["google-genai>=1.67"]
openai = ["openai>=1.109"]
all = [
    "ai-runtime-sdk[gemini,openai]",
]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
asyncio_mode = "auto"

